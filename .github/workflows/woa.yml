name: Windows ARM64 (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      qt-version:
        description: 'Qt version (e.g., 6.7.0)'
        required: true
        default: '6.7.0'
        type: string
      qt-modules:
        description: 'Additional Qt modules (space-separated, e.g., qtmultimedia qtimageformats)'
        required: false
        default: ''
        type: string
      use-mirror:
        description: 'Qt mirror (leave empty for default, e.g., https://mirrors.tuna.tsinghua.edu.cn/qt)'
        required: false
        default: 'https://mirrors.tuna.tsinghua.edu.cn/qt'
        type: string

jobs:
  build:
    name: Build Windows ARM64
    runs-on: windows-latest
    env:
      target-name: QtScrcpy
      qt-ver: ${{ inputs.qt-version }}
      platform-des: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up Visual Studio environment (ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
          vsversion: '2022'

      - name: Install Python and aqt
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall>=3.3

      - name: Install Qt (x64 base + arm64)
        env:
          AQT_MIRROR: ${{ inputs.use-mirror }}
        run: |
          $qtVer = "${{ env.qt-ver }}"
          $outDir = "C:\Qt\$qtVer"
          Write-Host "=== Installing Qt x64 (desktop) ==="
          aqt install-qt windows desktop $qtVer win64_msvc2019_64 --outputdir $outDir
          Write-Host "=== Installing Qt arm64 (cross-compile) ==="
          $modules = "${{ inputs.qt-modules }}".Trim()
          if ($modules) {
            aqt install-qt windows desktop $qtVer win64_msvc2019_arm64 --outputdir $outDir --modules $modules
          } else {
            aqt install-qt windows desktop $qtVer win64_msvc2019_arm64 --outputdir $outDir
          }

          # 动态查找 x64 目录
          $qtRoot = "$outDir\$qtVer"
          $x64Dir = Get-ChildItem -Path $qtRoot -Directory | Where-Object { $_.Name -like "*64*" -and $_.Name -notlike "*arm64*" } | Select-Object -First 1
          if (-not $x64Dir) {
            Write-Error "Could not find x64 installation directory in $qtRoot"
            exit 1
          }
          $qtX64Dir = $x64Dir.FullName
          Write-Host "Found x64 Qt directory: $qtX64Dir"

          # 动态查找 arm64 目录
          $arm64Dir = Get-ChildItem -Path $qtRoot -Directory | Where-Object { $_.Name -like "*arm64*" } | Select-Object -First 1
          if (-not $arm64Dir) {
            Write-Error "Could not find arm64 installation directory in $qtRoot"
            exit 1
          }
          $qtArm64Dir = $arm64Dir.FullName
          Write-Host "Found arm64 Qt directory: $qtArm64Dir"

          # 设置环境变量
          echo "QT_HOST_PATH=$qtX64Dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_PREFIX_PATH=$qtArm64Dir\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PATH=$qtArm64Dir\bin;$qtX64Dir\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Get the version (for tag)
        id: get-version
        run: echo "version=${env:GITHUB_REF##*/}" >> $env:GITHUB_OUTPUT

      - name: Generate version file
        run: python ci/generate-version.py

      - name: Build with CMake
        run: |
          Write-Host "CMAKE_PREFIX_PATH = $env:CMAKE_PREFIX_PATH"
          Write-Host "QT_HOST_PATH = $env:QT_HOST_PATH"
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" -DQT_HOST_PATH="$env:QT_HOST_PATH" -DCMAKE_BUILD_TYPE=Release -A ARM64
          cmake --build . --config Release

      - name: Package binary
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $artifactName = "${{ env.target-name }}-${{ env.platform-des }}-arm64-$version"
          mkdir output\artifacts -Force
          7z a -tzip "output\artifacts\$artifactName.zip" ".\build\Release\*.exe" ".\build\Release\*.dll"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target-name }}-${{ env.platform-des }}-arm64-${{ steps.get-version.outputs.version }}
          path: output/artifacts/*.zip
          if-no-files-found: warn

      - name: Check if artifacts exist
        id: check-artifacts
        run: |
          if (Test-Path output/artifacts/*.zip) {
            echo "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            echo "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check-artifacts.outputs.exists == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file: output/artifacts/*.zip
          file_glob: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
