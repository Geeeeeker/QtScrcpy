name: Windows ARM64 (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      qt-version:
        description: 'Qt version (e.g., 6.7.0)'
        required: true
        default: '6.7.0'
        type: string
      use-mirror:
        description: 'Qt mirror (leave empty for default, e.g., https://mirrors.tuna.tsinghua.edu.cn/qt)'
        required: false
        default: 'https://mirrors.tuna.tsinghua.edu.cn/qt'
        type: string

jobs:
  build:
    name: Build Windows ARM64
    runs-on: windows-latest  # x64 runner
    env:
      target-name: QtScrcpy
      qt-ver: ${{ inputs.qt-version }}
      platform-des: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          # 如需私有子模块，配置 SSH 密钥
          # ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Set up Visual Studio environment (ARM64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
          vsversion: '2022'

      - name: Install Python and aqt
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall>=3.3

      - name: Install Qt (x64 base + arm64)
        env:
          AQT_MIRROR: ${{ inputs.use-mirror }}
        run: |
          $qtVer = "${{ env.qt-ver }}"
          $outDir = "C:\Qt\$qtVer"

          Write-Host "=== Installing Qt x64 (desktop) ==="
          aqt install-qt windows desktop $qtVer win64_msvc2019_64 --outputdir $outDir

          Write-Host "=== Installing Qt arm64 (cross-compile) ==="
          aqt install-qt windows desktop $qtVer win64_msvc2019_arm64 --outputdir $outDir

          # 设置环境变量（供后续构建使用）
          echo "QT_INSTALL_PATH=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_PREFIX_PATH=$outDir\$qtVer\win64_msvc2019_arm64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PATH=$outDir\$qtVer\win64_msvc2019_arm64\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Get the version (for tag)
        id: get-version
        run: echo "version=${env:GITHUB_REF##*/}" >> $env:GITHUB_OUTPUT

      - name: Generate version file
        run: |
          python ci/generate-version.py

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" -DCMAKE_BUILD_TYPE=Release -A ARM64
          cmake --build . --config Release

      - name: Package binary
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          $artifactName = "${{ env.target-name }}-${{ env.platform-des }}-arm64-$version"
          mkdir output\artifacts -Force
          # 假设构建输出在 build\Release\ 下，将所有可执行文件和依赖打包
          7z a -tzip "output\artifacts\$artifactName.zip" ".\build\Release\*.exe" ".\build\Release\*.dll"
          # 如果项目有专门的打包脚本，可以在此调用
          # .\ci\windows\package.bat

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target-name }}-${{ env.platform-des }}-arm64-${{ steps.get-version.outputs.version }}
          path: output/artifacts/*.zip
          if-no-files-found: warn

      - name: Check if artifacts exist
        id: check-artifacts
        run: |
          if (Test-Path output/artifacts/*.zip) {
            echo "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            echo "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check-artifacts.outputs.exists == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          file: output/artifacts/*.zip
          file_glob: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
