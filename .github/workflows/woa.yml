name: Build for Windows ARM64 (Qt6)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: windows-latest
    env:
      target-name: QtScrcpy
      vcvarsall-path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
      qt-ver: '6.7.2'
      qt-arch-arm64: 'win64_msvc2019_arm64'
      qt-arch-x64: 'win64_msvc2019_64'
      msvc-arch: 'arm64'
      qt-install-path: ${{ github.workspace }}/Qt
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Cache Qt (combined x64+arm64)
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}
          key: ${{ runner.os }}-Qt-${{ env.qt-ver }}-combined-v1

      - name: Install aqt (if cache miss)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: pip install aqtinstall

      - name: Set aqt mirror (清华源)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: echo "AQT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/qt" >> $GITHUB_ENV

      - name: Install x64 desktop Qt (required as base for ARM64)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          echo "Installing x64 desktop Qt ${{ env.qt-ver }} ${{ env.qt-arch-x64 }}"
          aqt install-qt windows desktop ${{ env.qt-ver }} ${{ env.qt-arch-x64 }} \
            --outputdir ${{ env.qt-install-path }}
          echo "x64 installation finished."

      - name: List available modules for ARM64
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Available modules for ARM64:"
          aqt list-qt windows desktop --modules ${{ env.qt-ver }} ${{ env.qt-arch-arm64 }} || echo "No modules listed"

      - name: Install Qt ARM64
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          echo "Installing Qt ${{ env.qt-ver }} ${{ env.qt-arch-arm64 }}"
          aqt install-qt windows desktop ${{ env.qt-ver }} ${{ env.qt-arch-arm64 }} \
            --outputdir ${{ env.qt-install-path }}
          echo "ARM64 installation finished."

      - name: Verify combined Qt installation
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Checking x64 installation:"
          if [ -d "${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ env.qt-arch-x64 }}" ]; then
            echo "✅ x64 Qt installed"
          else
            echo "❌ x64 Qt missing"
          fi
          echo "Checking ARM64 installation:"
          if [ -d "${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ env.qt-arch-arm64 }}" ]; then
            echo "✅ ARM64 Qt installed"
          else
            echo "❌ ARM64 Qt missing"
            find "${{ env.qt-install-path }}" -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi

      - name: Skip if architecture unavailable
        if: steps.cache-qt.outputs.cache-hit != 'true' && failure()
        run: |
          echo "ARM64 Qt installation failed, skipping build."
          exit 1

      - name: Setup Qt environment
        id: setup-qt
        shell: bash
        run: |
          QT_BASE="${{ env.qt-install-path }}/${{ env.qt-ver }}"
          QT_ROOT="$QT_BASE/${{ env.qt-arch-arm64 }}"
          if [ ! -d "$QT_ROOT" ]; then
            echo "❌ Could not find ARM64 Qt at $QT_ROOT"
            exit 1
          fi
          echo "Found ARM64 Qt at: $QT_ROOT"

          QT6_CMAKE_DIR="$QT_ROOT/lib/cmake/Qt6"
          if [ -f "$QT6_CMAKE_DIR/Qt6Config.cmake" ]; then
            echo "✅ Found Qt6Config.cmake in $QT6_CMAKE_DIR"
            echo "Qt6_DIR=$QT6_CMAKE_DIR" >> $GITHUB_ENV
          else
            FOUND_DIR=$(find "$QT_ROOT" -name "Qt6Config.cmake" -printf "%h\n" -quit 2>/dev/null || echo "")
            if [ -n "$FOUND_DIR" ]; then
              QT6_CMAKE_DIR="$FOUND_DIR"
              echo "✅ Found Qt6Config.cmake in $QT6_CMAKE_DIR"
              echo "Qt6_DIR=$QT6_CMAKE_DIR" >> $GITHUB_ENV
            else
              echo "⚠️ Qt6Config.cmake not found"
              exit 1
            fi
          fi

          echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> $GITHUB_ENV
          echo "$QT_ROOT/bin" >> $GITHUB_PATH
          echo "ENV_QT_PATH=$QT_ROOT" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Verify Qt environment
        shell: bash
        run: |
          echo "Qt6_DIR=$Qt6_DIR"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "ENV_QT_PATH=$ENV_QT_PATH"
          if [ -f "$Qt6_DIR/Qt6Config.cmake" ]; then
            echo "✅ Qt6Config.cmake exists"
          else
            echo "❌ Qt6Config.cmake not found"
            exit 1
          fi

      - name: Build with CMake (direct)
        shell: cmd
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_QT_PATH: ${{ env.ENV_QT_PATH }}
        run: |
          call python ci\generate-version.py
          call "%ENV_VCVARSALL%" ${{ env.msvc-arch }}
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A ${{ env.msvc-arch }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="%ENV_QT_PATH%"
          cmake --build . --config RelWithDebInfo
          cd ..

      - name: Get the version
        shell: bash
        id: get-version
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_VCINSTALL: ${{ env.vcinstall-path }}
          ENV_QT_PATH: ${{ env.ENV_QT_PATH }}
          publish_name: ${{ env.target-name }}-win-${{ env.msvc-arch }}-${{ steps.get-version.outputs.version }}
        run: |
          cmd.exe /c ci\win\publish_for_win.bat ${{ env.msvc-arch }} ..\build\${{ env.publish_name }}
          Compress-Archive -Path ci\build\${{ env.publish_name }} ci\build\${{ env.publish_name }}.zip
          echo "package-name=${{ env.publish_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package-name }}.zip
          path: ci\build\${{ steps.package.outputs.package-name }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci\build\${{ steps.package.outputs.package-name }}.zip
          asset_name: ${{ steps.package.outputs.package-name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
