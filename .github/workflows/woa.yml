- name: Package with PowerShell
  id: package
  shell: powershell
  env:
    ENV_QT_PATH: ${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}
    publish_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.msvc-arch }}-${{ steps.get-version.outputs.version }}
  run: |
    $arch = "${{ matrix.msvc-arch }}"
    $outDir = "$pwd\build\$env:publish_name"
    Write-Host "Packaging to $outDir"

    # 创建目录
    New-Item -ItemType Directory -Force -Path $outDir | Out-Null

    # 复制 keymap 和 config
    Copy-Item -Path "keymap" -Destination "$outDir\" -Recurse -Force
    Copy-Item -Path "config\config.ini" -Destination "$outDir\" -Force

    # 复制主程序
    Copy-Item -Path "build\RelWithDebInfo\QtScrcpy.exe" -Destination "$outDir\" -Force

    # 运行 windeployqt（使用完整路径）
    & "$env:ENV_QT_PATH\bin\windeployqt.exe" "--$arch" "$outDir\QtScrcpy.exe"

    # 复制 adb（根据实际路径调整）
    if (Test-Path "ci\win\adb\$arch") {
        Copy-Item -Path "ci\win\adb\$arch\*" -Destination "$outDir\" -Recurse -Force
    }

    # 列出内容
    Get-ChildItem $outDir -Recurse

    # 压缩
    Compress-Archive -Path $outDir -DestinationPath "$pwd\build\$env:publish_name.zip" -Force
    Write-Host "package-name=$env:publish_name" >> $env:GITHUB_OUTPUT
