name: Windows (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Comma-separated list of architectures to build (arm64, i386, amd64)'
        required: true
        default: 'arm64'
        type: string
      qt-version:
        description: 'Qt version to use (e.g., 6.7.0)'
        required: true
        default: '6.7.0'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          arch_map='{
            "i386":  {"qt-arch":"win32_msvc2019","msvc-arch":"x86","qt-arch-install":"win32_msvc2019"},
            "amd64": {"qt-arch":"win64_msvc2019_64","msvc-arch":"x64","qt-arch-install":"win64_msvc2019_64"},
            "arm64": {"qt-arch":"win64_msvc2019_arm64","msvc-arch":"arm64","qt-arch-install":"win64_msvc2019_arm64"}
          }'
          IFS=',' read -ra archs <<< "${{ github.event.inputs.architectures }}"
          entries=()
          for arch in "${archs[@]}"; do
            arch=$(echo "$arch" | xargs)
            entry=$(echo "$arch_map" | jq -c --arg a "$arch" '.[$a] // empty')
            if [[ -n "$entry" ]]; then entries+=("$entry"); else echo "⚠️ 忽略未知架构 '$arch'"; fi
          done
          if [ ${#entries[@]} -eq 0 ]; then echo "❌ 没有有效架构"; exit 1; fi
          matrix_json=$(printf '%s\n' "${entries[@]}" | jq -c -s '.')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.msvc-arch }} (Qt ${{ inputs.qt-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      target-name: QtScrcpy
      vcvarsall-path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
      vcinstall-path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC'
      qt-ver: ${{ inputs.qt-version }}
      qt-install-path: ${{ github.workspace }}/Qt
      plantform-des: win
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}
          key: ${{ runner.os }}-Qt-${{ env.qt-ver }}-${{ matrix.qt-arch }}-v3

      - name: Install aqt (if cache miss)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: pip install aqtinstall

      - name: Set aqt mirror (清华源)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: echo "AQT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/qt" >> $GITHUB_ENV

      - name: Check available architectures for Qt ${{ env.qt-ver }}
        if: steps.cache-qt.outputs.cache-hit != 'true'
        id: check-arch
        shell: bash
        run: |
          AVAIL_ARCH=$(aqt list-qt windows desktop --arch ${{ env.qt-ver }})
          echo "Available architectures: $AVAIL_ARCH"
          if echo "$AVAIL_ARCH" | grep -q "${{ matrix.qt-arch }}"; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Qt (manual)
        if: steps.cache-qt.outputs.cache-hit != 'true' && steps.check-arch.outputs.available == 'true'
        shell: bash
        run: |
          aqt install-qt windows desktop ${{ env.qt-ver }} ${{ matrix.qt-arch }} \
            --outputdir ${{ env.qt-install-path }} \
            --modules qtbase qtsvg qttools qtdeclarative qtquickcontrols2
          QT_ROOT="${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}"
          # 查找 Qt6Config.cmake 位置
          QT6_CMAKE_DIR=$(find "$QT_ROOT" -name "Qt6Config.cmake" -printf "%h\n" -quit 2>/dev/null || echo "")
          if [ -n "$QT6_CMAKE_DIR" ]; then
            echo "✅ Found Qt6Config.cmake in $QT6_CMAKE_DIR"
            echo "Qt6_DIR=$QT6_CMAKE_DIR" >> $GITHUB_ENV
            echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> $GITHUB_ENV
          else
            echo "⚠️ Qt6Config.cmake not found, using default paths."
            echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> $GITHUB_ENV
          fi
          echo "$QT_ROOT/bin" >> $GITHUB_PATH
          echo "ENV_QT_PATH=$QT_ROOT" >> $GITHUB_ENV

      - name: Skip if architecture unavailable
        if: steps.check-arch.outputs.available == 'false'
        run: |
          echo "Architecture ${{ matrix.qt-arch }} not available, skipping build."
          exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Verify Qt environment
        shell: bash
        run: |
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "ENV_QT_PATH=$ENV_QT_PATH"
          echo "PATH=$PATH"
          if [ -f "$CMAKE_PREFIX_PATH/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            echo "✅ Qt6Config.cmake exists at $CMAKE_PREFIX_PATH/lib/cmake/Qt6/Qt6Config.cmake"
          else
            echo "❌ Qt6Config.cmake not found"
            find "${{ env.qt-install-path }}" -name "Qt6Config.cmake" 2>/dev/null || true
          fi

      - name: Build with CMake (direct)
        shell: cmd
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_QT_PATH: ${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}
        run: |
          call python ci\generate-version.py
          call "%ENV_VCVARSALL%" ${{ matrix.msvc-arch }}
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A ${{ matrix.msvc-arch }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="%ENV_QT_PATH%"
          cmake --build . --config RelWithDebInfo
          cd ..

      - name: Get the version
        shell: bash
        id: get-version
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      # 关键步骤：使用 windeployqt 自动收集 Qt 依赖
      - name: Run windeployqt (ARM64)
        shell: cmd
        env:
          ENV_QT_PATH: ${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}
        run: |
          set PATH=%ENV_QT_PATH%\bin;%PATH%
          mkdir ci\build\temp
          xcopy build\RelWithDebInfo\QtScrcpy.exe ci\build\temp\ /Y
          windeployqt --release --no-translations --compiler-runtime ci\build\temp\QtScrcpy.exe
          # 可选：额外复制需要的第三方 DLL
          rem 复制依赖的第三方库（如 OpenGL、多媒体等）到临时目录
          rem 例如 xcopy third_party\lib\*.dll ci\build\temp\ /Y

      - name: Download and setup ARM64 adb
        shell: cmd
        run: |
          mkdir ci\build\temp\adb
          curl -L -o adb.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          powershell Expand-Archive adb.zip -DestinationPath ci\build\temp\adb -Force
          move ci\build\temp\adb\platform-tools\adb.exe ci\build\temp\
          rem 如果项目需要 adb，确保 scrcpy-server 也正确放置（已有子模块）
          rem 可根据需要复制其他文件

      - name: Package final release
        id: package
        env:
          publish_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.msvc-arch }}-${{ steps.get-version.outputs.version }}
        run: |
          mkdir ci\build\${{ env.publish_name }}
          xcopy ci\build\temp ci\build\${{ env.publish_name }} /E /I /Y
          Compress-Archive -Path ci\build\${{ env.publish_name }} ci\build\${{ env.publish_name }}.zip
          echo "package-name=${{ env.publish_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package-name }}.zip
          path: ci\build\${{ steps.package.outputs.package-name }}.zip

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci\build\${{ steps.package.outputs.package-name }}.zip
          asset_name: ${{ steps.package.outputs.package-name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
