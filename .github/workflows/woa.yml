name: Windows (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Comma-separated list of architectures to build (arm64, i386, amd64)'
        required: true
        default: 'arm64'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          arch_map='{
            "i386":  {"qt-arch":"win32_msvc2019","msvc-arch":"x86","qt-arch-install":"win32_msvc2019"},
            "amd64": {"qt-arch":"win64_msvc2019_64","msvc-arch":"x64","qt-arch-install":"win64_msvc2019_64"},
            "arm64": {"qt-arch":"win64_msvc2019_arm64","msvc-arch":"arm64","qt-arch-install":"win64_msvc2019_arm64"}
          }'
          IFS=',' read -ra archs <<< "${{ github.event.inputs.architectures }}"
          entries=()
          for arch in "${archs[@]}"; do
            arch=$(echo "$arch" | xargs)
            entry=$(echo "$arch_map" | jq -c --arg a "$arch" '.[$a] // empty')
            if [[ -n "$entry" ]]; then entries+=("$entry"); else echo "⚠️ 忽略未知架构 '$arch'"; fi
          done
          if [ ${#entries[@]} -eq 0 ]; then echo "❌ 没有有效架构"; exit 1; fi
          matrix_json=$(printf '%s\n' "${entries[@]}" | jq -c -s '.')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.msvc-arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      target-name: QtScrcpy
      vcvarsall-path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
      vcinstall-path: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC'
      qt-ver: '5.15.2'
      qt-install-path: ${{ github.workspace }}/Qt
      plantform-des: win
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.qt-install-path }}
          key: ${{ runner.os }}-Qt-${{ env.qt-ver }}-${{ matrix.qt-arch }}-v2  # 更新key以强制重新安装（如需）

      - name: Install aqt (if cache miss)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: pip install aqtinstall

      - name: Set aqt mirror (清华源)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: echo "AQT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/qt" >> $GITHUB_ENV

      - name: Check available architectures for Qt ${{ env.qt-ver }}
        if: steps.cache-qt.outputs.cache-hit != 'true'
        id: check-arch
        shell: bash
        run: |
          AVAIL_ARCH=$(aqt list-qt windows desktop --arch ${{ env.qt-ver }})
          echo "Available architectures: $AVAIL_ARCH"
          if echo "$AVAIL_ARCH" | grep -q "${{ matrix.qt-arch }}"; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Qt (manual)
        if: steps.cache-qt.outputs.cache-hit != 'true' && steps.check-arch.outputs.available == 'true'
        shell: bash
        run: |
          aqt install-qt windows desktop ${{ env.qt-ver }} ${{ matrix.qt-arch }} \
            --outputdir ${{ env.qt-install-path }} \
            --modules qtbase qtsvg qttools qtdeclarative   # 增加模块以确保CMake配置完整
          QT_ROOT="${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}"
          # 动态查找 Qt5Config.cmake 的正确位置
          QT5_CMAKE_DIR=$(find "$QT_ROOT" -name "Qt5Config.cmake" -printf "%h\n" -quit 2>/dev/null || echo "")
          if [ -n "$QT5_CMAKE_DIR" ]; then
            echo "✅ Found Qt5Config.cmake in $QT5_CMAKE_DIR"
            echo "Qt5_DIR=$QT5_CMAKE_DIR" >> $GITHUB_ENV
            echo "QT_DIR=$QT5_CMAKE_DIR" >> $GITHUB_ENV
            echo "CMAKE_PREFIX_PATH=$QT5_CMAKE_DIR" >> $GITHUB_ENV
          else
            echo "⚠️ Qt5Config.cmake not found, using default paths."
            echo "Qt5_DIR=$QT_ROOT/lib/cmake/Qt5" >> $GITHUB_ENV
            echo "QT_DIR=$QT_ROOT/lib/cmake/Qt5" >> $GITHUB_ENV
            echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> $GITHUB_ENV
          fi
          echo "$QT_ROOT/bin" >> $GITHUB_PATH
          # 调试：列出Qt安装内容（前100行）
          echo "Qt installation contents (first 100 lines):"
          ls -R "$QT_ROOT" 2>/dev/null | head -100 || true

      - name: Skip if architecture unavailable
        if: steps.check-arch.outputs.available == 'false'
        run: |
          echo "Architecture ${{ matrix.qt-arch }} not available, skipping build."
          exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Verify Qt environment
        shell: bash
        run: |
          echo "Qt5_DIR=$Qt5_DIR"
          echo "QT_DIR=$QT_DIR"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "PATH=$PATH"
          if [ -f "$Qt5_DIR/Qt5Config.cmake" ]; then
            echo "✅ Qt5Config.cmake exists at $Qt5_DIR/Qt5Config.cmake"
          else
            echo "❌ Qt5Config.cmake not found at $Qt5_DIR/Qt5Config.cmake"
            # 尝试查找所有 config 文件
            find "${{ env.qt-install-path }}" -name "*Config.cmake" 2>/dev/null || true
          fi

      - name: Build MSVC
        shell: cmd
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_QT_PATH: ${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}
        run: |
          call python ci\generate-version.py
          call "ci\win\build_for_win.bat" RelWithDebInfo ${{ matrix.msvc-arch }}

      - name: Get the version
        shell: bash
        id: get-version
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_VCINSTALL: ${{ env.vcinstall-path }}
          ENV_QT_PATH: ${{ env.qt-install-path }}/${{ env.qt-ver }}/${{ matrix.qt-arch-install }}
          publish_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.msvc-arch }}-${{ steps.get-version.outputs.version }}
        run: |
          cmd.exe /c ci\win\publish_for_win.bat ${{ matrix.msvc-arch }} ..\build\${{ env.publish_name }}
          Compress-Archive -Path ci\build\${{ env.publish_name }} ci\build\${{ env.publish_name }}.zip
          echo "package-name=${{ env.publish_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package-name }}.zip
          path: ci\build\${{ steps.package.outputs.package-name }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci\build\${{ steps.package.outputs.package-name }}.zip
          asset_name: ${{ steps.package.outputs.package-name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
