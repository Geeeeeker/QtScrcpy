name: QtScrcpy WOA Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-woa:
    runs-on: windows-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5.15.2 for Windows ARM64 (MSVC 2019)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: desktop
          arch: win_arm64_msvc2019_64

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build scrcpy-server.apk
        run: |
          cd server
          ./gradlew assembleRelease
          cp build/outputs/apk/release/app-release.apk ../QtScrcpyCore/src/third_party/scrcpy-server
          ren ../QtScrcpyCore/src/third_party/scrcpy-server app-release.apk scrcpy-server

      - name: Configure CMake for Release (ARM64)
        run: |
          mkdir -p output/arm64/Release
          cd output/arm64/Release
          cmake -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_BUILD_TYPE=Release ../../..

      - name: Build QtScrcpy.exe (Release)
        run: |
          cmake --build . --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-WOA
          path: output/arm64/Release/QtScrcpy.exe
          retention-days: 1
