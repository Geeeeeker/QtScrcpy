name: Ubuntu (Manual Dispatch Multi-Arch)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Comma-se-separated list of architectures to build (arm, arm64, i386, amd64)'
        required: true
        default: 'amd64'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # 架构映射：对 amd64/arm64/arm 使用 Ubuntu 22.04，i386 使用 20.04（因 22.04 无官方 i386 镜像）
          arch_map='{
            "amd64": {"platform":"linux/amd64","qt-arch":"gcc_64","gcc-arch":"x64","container-image":"ubuntu:22.04"},
            "i386":  {"platform":"linux/386",  "qt-arch":"gcc_32","gcc-arch":"x86","container-image":"i386/ubuntu:20.04"},
            "arm64": {"platform":"linux/arm64", "qt-arch":"linux_arm64","gcc-arch":"arm64","container-image":"arm64v8/ubuntu:22.04"},
            "arm":   {"platform":"linux/arm/v7","qt-arch":"linux_armv7","gcc-arch":"arm","container-image":"arm32v7/ubuntu:22.04"}
          }'
          IFS=',' read -ra archs <<< "${{ github.event.inputs.architectures }}"
          entries=()
          for arch in "${archs[@]}"; do
            arch=$(echo "$arch" | xargs)
            entry=$(echo "$arch_map" | jq -c --arg a "$arch" '.[$a] // empty')
            if [[ -n "$entry" ]]; then
              entries+=("$entry")
            else
              echo "⚠️ 警告: 未知架构 '$arch'，已忽略"
            fi
          done
          if [ ${#entries[@]} -eq 0 ]; then
            echo "❌ 错误: 没有有效的架构可构建"
            exit 1
          fi
          matrix_json=$(printf '%s\n' "${entries[@]}" | jq -c -s '.')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.gcc-arch }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      target-name: QtScrcpy
      qt-ver: '5.15.2'
      plantform-des: ubuntu
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Build in Docker container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GITHUB_WORKSPACE=${{ github.workspace }} \
            -e GITHUB_REF=${{ github.ref }} \
            ${{ matrix.container-image }} \
            bash -c "
              set -e
              echo '=== Installing basic dependencies ==='
              apt-get update
              apt-get install -y git ca-certificates sudo

              echo '=== Installing system dependencies ==='
              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                libglew-dev \
                libglfw3-dev \
                imagemagick \
                wget \
                patchelf \
                zip \
                libxcb1-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                libx11-dev \
                libx11-xcb-dev \
                libfontconfig1-dev \
                libfreetype6-dev \
                libxrender-dev \
                libxext-dev \
                gnupg \
                lsb-release \
                fuse \
                libasound2-dev

              echo '=== Setting up FUSE ==='
              apt-get install -y fuse
              if [ ! -e /dev/fuse ]; then
                mknod /dev/fuse c 10 229 || true
                chmod 666 /dev/fuse || true
              fi
              export APPIMAGE_EXTRACT_AND_RUN=1

              echo '=== Installing CMake 3.19+ ==='
              apt-get install -y software-properties-common
              apt-get update
              apt-get install -y cmake=3.19.* || {
                wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | apt-key add -
                apt-add-repository 'deb https://apt.kitware.com/ubuntu/ focal main'
                apt-get update
                apt-get install -y cmake
              }

              echo '=== Installing Python and aqt ==='
              # 检测系统版本
              . /etc/os-release
              if [ \"\$VERSION_ID\" = \"20.04\" ]; then
                  # Ubuntu 20.04 (i386) 通过 deadsnakes 安装 Python 3.11
                  apt-get install -y software-properties-common curl
                  add-apt-repository -y ppa:deadsnakes/ppa
                  apt-get update
                  apt-get install -y python3.11 python3.11-distutils python3.11-venv
                  update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
                  curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
              else
                  # Ubuntu 22.04+ 使用系统 Python 3.10
                  apt-get install -y python3 python3-pip
              fi
              # 升级 pip 并安装 aqt
              pip3 install --upgrade pip
              pip3 install 'aqtinstall>=3.3'

              # 设置镜像源（可选，使用清华源提高速度）
              export AQT_MIRROR='https://mirrors.tuna.tsinghua.edu.cn/qt'

              echo '=== Checking available architectures for Qt ${{ env.qt-ver }} ==='
              AVAIL_ARCH=\$(aqt list-qt linux desktop --arch ${{ env.qt-ver }})
              echo \"Available architectures: \$AVAIL_ARCH\"
              if ! echo \"\$AVAIL_ARCH\" | grep -q \"${{ matrix.qt-arch }}\"; then
                  echo \"❌ Architecture ${{ matrix.qt-arch }} not available, skipping build.\"
                  exit 0
              fi

              echo '=== Installing Qt ==='
              export QT_INSTALL_PATH=${{ github.workspace }}/Qt/${{ env.qt-ver }}
              aqt install-qt linux desktop ${{ env.qt-ver }} ${{ matrix.qt-arch }} \
                --outputdir ${{ github.workspace }}/Qt \
                --modules qtbase

              # 设置 Qt 环境变量
              export CMAKE_PREFIX_PATH=\$QT_INSTALL_PATH/${{ matrix.qt-arch }}
              export PATH=\$QT_INSTALL_PATH/${{ matrix.qt-arch }}/bin:\$PATH

              echo '=== Generating version ==='
              python3 ci/generate-version.py

              echo '=== Building ==='
              ci/linux/build_for_linux.sh 'Release'

              echo '=== Packaging AppImage ==='
              chmod +x ci/linux/package_appimage.sh
              ci/linux/package_appimage.sh 'Release'

              echo '=== Preparing artifact ==='
              mkdir -p ${{ github.workspace }}/output/artifacts
              cp output/appimage/*.AppImage ${{ github.workspace }}/output/artifacts/ 2>/dev/null || true
            "

      - name: Get the version
        id: get-version
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.gcc-arch }}-${{ steps.get-version.outputs.version }}-AppImage
          path: output/artifacts/*.AppImage
          if-no-files-found: warn

      - name: Prepare AppImage for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APPIMAGE_FILE=$(find output/artifacts -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE_FILE" ] || [ ! -f "$APPIMAGE_FILE" ]; then
            echo "Warning: AppImage file not found, skipping release upload"
            exit 0
          fi
          FINAL_NAME="${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.gcc-arch }}-${{ steps.get-version.outputs.version }}.AppImage"
          cp "$APPIMAGE_FILE" "$FINAL_NAME"

      - name: Upload AppImage to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          file: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.gcc-arch }}-${{ steps.get-version.outputs.version }}.AppImage
          asset_name: ${{ env.target-name }}-${{ env.plantform-des }}-${{ matrix.gcc-arch }}-${{ steps.get-version.outputs.version }}.AppImage
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
