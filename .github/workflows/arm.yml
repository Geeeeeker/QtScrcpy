echo '=== Installing Qt ${{ env.qt-ver }} with required modules ==='
export QT_INSTALL_PATH=${{ github.workspace }}/Qt/${{ env.qt-ver }}
# 尝试使用 aqt 安装 Qt 预编译包
set +e
aqt install-qt linux desktop ${{ env.qt-ver }} ${{ matrix.qt-arch }} \
  --outputdir ${{ github.workspace }}/Qt \
  --modules qtmultimedia qtsvg
INSTALL_EXIT=$?
set -e
if [ $INSTALL_EXIT -ne 0 ]; then
  echo "⚠️ aqt 无法安装 ${{ matrix.qt-arch }} 的 Qt ${{ env.qt-ver }}, 尝试使用系统 apt 安装..."
  
  # 启用 Ubuntu 官方 universe 仓库（包含 qt6-svg 等包）
  add-apt-repository -y universe
  
  # 可选：添加较新 Qt 的可靠 PPA（如 ubuntu-toolchain-r/test 提供 Qt 6.5+，但仅 amd64；ARM 需谨慎）
  # 此处直接使用 Ubuntu 22.04 官方源中的 Qt 6.2.4，包名正确
  apt-get update
  apt-get install -y qt6-base-dev qt6-multimedia-dev qt6-svg-dev
  
  # 设置环境变量指向系统 Qt
  export CMAKE_PREFIX_PATH=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/cmake/Qt6
  export PATH=/usr/lib/qt6/bin:$PATH
else
  # aqt 安装成功，设置路径
  export CMAKE_PREFIX_PATH=$QT_INSTALL_PATH/${{ matrix.qt-arch }}/lib/cmake/Qt6
  export PATH=$QT_INSTALL_PATH/${{ matrix.qt-arch }}/bin:$PATH
fi
