
name: Build QtScrcpy ARM/ARM64

on:
  push:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/build-qtscrcpy-arm.yml'
      - 'ci/linux/**'
  pull_request:
    paths:
      - 'QtScrcpy/**'
      - '!QtScrcpy/res/**'
      - '.github/workflows/build-qtscrcpy-arm.yml'

jobs:
  build:
    name: Build QtScrcpy for ARM
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [arm64]
        qt_ver: [6.5.3]
    env:
      target_name: QtScrcpy
      qt_install_path: ${{ github.workspace }}/qt
      platform_desc: ubuntu-${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git wget libgl1-mesa-dev libxcb-xinerama0

      - name: Download Qt installer for ARM64
        run: |
          wget https://mirrors.tuna.tsinghua.edu.cn/qt/official_releases/online_installers/qt-online-installer-linux-arm64-online.run -O qt-installer.run
          chmod +x qt-installer.run

      - name: Install Qt for ARM64
        run: |
          ./qt-installer.run \
            --root-path ${{ env.qt_install_path }} \
            --accept-license \
            --accept-optional-components \
            --no-force-installation \
            --verbose \
            --add-component qt.qt6.${{ matrix.qt_ver }}.arm64 \
            --add-component qt.qt6.${{ matrix.qt_ver }}.qtmultimedia \
            --add-component qt.qt6.${{ matrix.qt_ver }}.qtdeclarative \
            --add-component qt.tools.cmake \
            --add-component qt.tools.ninja

      - name: Build QtScrcpy for ARM64
        env:
          ENV_QT_PATH: ${{ env.qt_install_path }}/Tools/QtCreator/bin
        run: |
          export QT_PATH=${{ env.qt_install_path }}/${{ matrix.qt_ver }}/gcc_64
          export PATH=$QT_PATH/bin:$PATH
          mkdir -p output/${{ matrix.arch }}/Release
          ./ci/linux/build_for_linux.sh "Release"

      - name: Package ARM64 build
        run: |
          cd output/${{ matrix.arch }}/Release
          zip -r ../../../QtScrcpy-ubuntu-${{ matrix.arch }}-${{ matrix.qt_ver }}.zip QtScrcpy scrcpy-server

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-ubuntu-${{ matrix.arch }}-${{ matrix.qt_ver }}
          path: QtScrcpy-ubuntu-${{ matrix.arch }}-${{ matrix.qt_ver }}.zip
