name: Build Qt 5.15.2 for ARM (Native Runners)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Comma-separated list of ARM architectures to build (arm64 only, arm32 support deprecated)'
        required: true
        default: 'arm64'
        type: string
  push:
    tags:
      - 'qt-*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # GitHub 官方仅提供 ARM64 原生运行器，且 Node 24 将不再支持 ARM32 [citation:7]
          # 因此矩阵目前只支持 arm64，如需 arm32 仍需使用 QEMU 方案
          arch_map='{
            "arm64": {"runner":"ubuntu-24.04-arm", "gcc-arch":"arm64", "qt-configure-args":"-xcb -system-xcb"}
          }'
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IFS=',' read -ra archs <<< "${{ github.event.inputs.architectures }}"
          else
            # tag 触发时默认只构建 arm64
            archs=("arm64")
          fi
          
          entries=()
          for arch in "${archs[@]}"; do
            arch=$(echo "$arch" | xargs)
            if [[ "$arch" != "arm64" ]]; then
              echo "⚠️ 警告: 架构 '$arch' 无法使用原生运行器，已忽略。如需构建 arm32，请回退至 QEMU 方案。"
              continue
            fi
            entry=$(echo "$arch_map" | jq -c --arg a "$arch" '.[$a] // empty')
            if [[ -n "$entry" ]]; then
              entries+=("$entry")
            fi
          done
          
          if [ ${#entries[@]} -eq 0 ]; then
            echo "❌ 错误: 没有有效的 ARM 架构可构建"
            exit 1
          fi
          matrix_json=$(printf '%s\n' "${entries[@]}" | jq -c -s '.')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build-qt:
    needs: prepare
    name: Build Qt 5.15.2 for ${{ matrix.gcc-arch }}
    # 关键修改：直接使用原生 ARM 运行器 [citation:6]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      QT_VERSION: '5.15.2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            perl \
            python3 \
            git \
            wget \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-xinput-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrender-dev \
            libxrandr-dev \
            libxi-dev \
            libxss-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libssl-dev \
            && sudo apt-get clean

      - name: Download Qt source
        run: |
          QT_MAJOR_MINOR=$(echo ${{ env.QT_VERSION }} | cut -d. -f1-2)
          QT_SRC_URL="https://download.qt.io/archive/qt/${QT_MAJOR_MINOR}/${{ env.QT_VERSION }}/single/qt-everywhere-opensource-src-${{ env.QT_VERSION }}.tar.xz"
          echo "Downloading Qt source from $QT_SRC_URL"
          wget -q ${QT_SRC_URL} -O qt-src.tar.xz
          tar -xf qt-src.tar.xz

      - name: Configure and build Qt
        run: |
          cd qt-everywhere-src-${{ env.QT_VERSION }}
          mkdir build && cd build
          
          # 配置 Qt，可根据需要调整参数
          ../configure -prefix /opt/Qt/${{ env.QT_VERSION }}/${{ matrix.gcc-arch }} \
            -opensource -confirm-license \
            -nomake examples -nomake tests \
            -skip qtwayland -skip qtwebengine -skip qtwebview \
            -no-openssl -no-eglfs -no-linuxfb \
            ${{ matrix.qt-configure-args }} \
            -qt-libpng -qt-libjpeg -qt-zlib -qt-pcre \
            -dbus-linked -no-icu -no-glib -no-cups \
            -no-iconv -no-tslib -no-pch \
            -optimize-size -release
          
          # 利用所有 CPU 核心编译
          make -j$(nproc)
          sudo make install

      - name: Package Qt installation
        run: |
          cd /opt
          tar -czf ${{ github.workspace }}/qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}.tar.gz Qt

      - name: Upload Qt build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}
          path: qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build-qt
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: artifacts/**/*.tar.gz
          file_glob: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
