name: Install Qt 5.15.2 for ARM64 (aqtinstall)

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architecture to get (only arm64 is supported by aqt for Linux ARM)'
        required: true
        default: 'arm64'
        type: string
  push:
    tags:
      - 'qt-*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Validate and generate matrix
        id: set-matrix
        run: |
          arch_map='{
            "arm64": {"runner":"ubuntu-24.04-arm", "gcc-arch":"arm64", "qt-arch":"linux_arm64"}
          }'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IFS=',' read -ra archs <<< "${{ github.event.inputs.architectures }}"
          else
            archs=("arm64")
          fi
          entries=()
          for arch in "${archs[@]}"; do
            arch=$(echo "$arch" | xargs)
            if [[ "$arch" != "arm64" ]]; then
              echo "⚠️ 警告: 架构 '$arch' 无法通过 aqt 获取预编译包，已忽略。仅 arm64 被支持。"
              continue
            fi
            entry=$(echo "$arch_map" | jq -c --arg a "$arch" '.[$a] // empty')
            if [[ -n "$entry" ]]; then
              entries+=("$entry")
            fi
          done
          if [ ${#entries[@]} -eq 0 ]; then
            echo "❌ 错误: 没有有效的 ARM 架构可处理"
            exit 1
          fi
          matrix_json=$(printf '%s\n' "${entries[@]}" | jq -c -s '.')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  install-qt:
    needs: prepare
    name: Install Qt 5.15.2 for ${{ matrix.gcc-arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      QT_VERSION: '5.15.2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            wget \
            xz-utils \
            libxcb-util1 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-xcb1 \
            libxcb-glx0 \
            libxcb-present0 \
            libxcb-dri3-0 \
            libxcb-dri2-0 \
            libgl1 \
            libglu1-mesa \
            && sudo apt-get clean

      - name: Install aqtinstall (latest)
        run: |
          python3 -m venv ${{ github.workspace }}/venv
          source ${{ github.workspace }}/venv/bin/activate
          pip install --upgrade pip
          pip install --upgrade aqtinstall

      - name: Set Qt installation directory
        run: |
          echo "QT_INSTALL_DIR=/opt/Qt/${{ env.QT_VERSION }}/${{ matrix.gcc-arch }}" >> $GITHUB_ENV

      - name: Install Qt ${{ env.QT_VERSION }} for ${{ matrix.qt-arch }}
        run: |
          source ${{ github.workspace }}/venv/bin/activate
          sudo mkdir -p ${{ env.QT_INSTALL_DIR }}
          # 使用归档镜像并仅安装基础模块 qtbase
          export AQT_MIRROR='https://download.qt.io/archive/'
          aqt install-qt linux desktop ${{ env.QT_VERSION }} ${{ matrix.qt-arch }} \
            --outputdir /opt/Qt \
            -m qtbase
          # aqt 默认将安装目录命名为 gcc_64，移动到期望的路径
          if [ -d "/opt/Qt/${{ env.QT_VERSION }}/gcc_64" ]; then
            sudo mv /opt/Qt/${{ env.QT_VERSION }}/gcc_64 ${{ env.QT_INSTALL_DIR }}
          fi

      - name: Verify Qt installation
        run: |
          ls -la ${{ env.QT_INSTALL_DIR }}/bin
          ${{ env.QT_INSTALL_DIR }}/bin/qmake --version

      - name: Package Qt installation
        run: |
          cd /opt
          sudo tar -czf ${{ github.workspace }}/qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}.tar.gz Qt

      - name: Upload Qt package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}
          path: qt-${{ env.QT_VERSION }}-${{ matrix.gcc-arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: install-qt
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          file: artifacts/**/*.tar.gz
          file_glob: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
